# Photo Booth Playbook v1.0.1 の
# robot-controller-service/data/hardware_config.yaml の PID gain を
# Phase 1 検証 (reachy-mini-daemon デフォルト) 相当に下げた版です。
#
# 当初 Input Voltage Error の原因と仮定して試行しました。
# 結論: PID gain は原因ではなく、Input Voltage Error は Dynamixel の
#       警告レベルフラグで実動作には影響なし (記事 README を参照)。
#
# このパッチは「Photo Booth 推奨設定 (高 PID で応答性重視) を保ったまま
# 試行錯誤の途中でこちらを使った」という記録目的で残します。
# 通常運用では公式の `hardware_config.yaml` (P=400 等) を使ってください。

version: beta

serial:
  baudrate: 1000000

motors:
  - body_rotation:
      id: 10
      offset: 0
      lower_limit: 0
      upper_limit: 4095
      return_delay_time: 0
      shutdown_error: 52
      pid:
        - 200      # 公式 300
        - 0
        - 0        # 公式 250
  - stewart_1:
      id: 11
      offset: 1024
      lower_limit: 1502
      upper_limit: 2958
      return_delay_time: 0
      shutdown_error: 52
      pid:
        - 300      # 公式 400
        - 0
        - 0
