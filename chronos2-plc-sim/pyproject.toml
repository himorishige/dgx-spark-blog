[project]
name = "chronos2-plc-sim"
version = "0.1.0"
description = "PLC-style factory simulator + Chronos-2 + Nemotron LLM maintenance-comment pipeline (blog reference implementation)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
llm = [
    "httpx>=0.27",
]

[tool.uv]
package = false
